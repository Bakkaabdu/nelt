# Local production-like stack: SQL Server + Nelt.
#   docker compose up --build   →   http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Nelt_Local_2026!}"
    ports:
      - "1433:1433"   # lets `dotnet run` (Development settings) use this database
    volumes:
      - nelt-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Server=db;Database=Nelt;User Id=sa;Password=${DB_PASSWORD:-Nelt_Local_2026!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@nelt.local}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-ChangeMe-2026}"
      Devices__AllowPlainHttp: "true"
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - nelt-files:/data

volumes:
  nelt-sql:
  nelt-files:
